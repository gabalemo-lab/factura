<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0E2A22" />
  <title>PLAZO</title>
  <!-- PLAZO v6 JS sano -->
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>:root {
  --forest: #0e2a22;
  --forest-2: #14352c;
  --leaf: #1c5a45;
  --mint: #d8efe4;
  --brass: #c4a35a;
  --brass-2: #e8d5a3;
  --cream: #f3eee4;
  --paper: #fbf8f2;
  --card: #fffdf8;
  --ink: #12211c;
  --muted: #5d6c65;
  --line: #e6ddcf;
  --danger: #b54538;
  --danger-soft: #f8e4e1;
  --ok: #1b7a4c;
  --ok-soft: #d9f0e4;
  --warn: #b57a1d;
  --warn-soft: #f7ead0;
  --info: #2a5f8a;
  --info-soft: #dceaf5;
  --shadow: 0 10px 30px rgba(14, 42, 34, 0.08);
  --nav-h: 72px;
  --radius: 18px;
  --font: "Manrope", "Segoe UI", system-ui, sans-serif;
  --display: "Fraunces", Georgia, serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; min-height: 100%; }
body {
  font-family: var(--font);
  background: var(--cream);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font-family: inherit; }
a { color: inherit; }
img { max-width: 100%; }
.app-hidden { display: none !important; }

/* LOGIN */
.login {
  min-height: 100dvh;
  background:
    radial-gradient(1200px 500px at 80% -10%, rgba(196, 163, 90, 0.18), transparent 50%),
    linear-gradient(165deg, #0b211b 0%, #14352c 48%, #0e2a22 100%);
  color: #f4efe4;
  display: flex;
  flex-direction: column;
  padding: 28px 22px 36px;
}
.login-mark {
  width: 76px; height: 76px; border-radius: 20px;
  background: #f4efe4; padding: 8px; object-fit: cover;
  box-shadow: 0 12px 30px rgba(0,0,0,.25);
}
.login h1 {
  font-family: var(--display);
  font-weight: 650; font-size: 42px; margin: 22px 0 6px; letter-spacing: -0.03em;
}
.login .tag {
  color: #d8c89a; font-size: 15px; max-width: 28ch; line-height: 1.45; margin: 0 0 28px;
}
.pin-box {
  background: rgba(255,255,255,.06);
  border: 1px solid rgba(232, 213, 163, .22);
  border-radius: 22px; padding: 18px;
}
.pin-box label { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: #c9b88a; }
.pin-row { display: flex; gap: 8px; margin-top: 12px; }
.pin-row input {
  flex: 1; height: 56px; border-radius: 14px; border: 0;
  background: #fbf8f2; color: var(--ink); font-size: 28px; letter-spacing: .35em;
  text-align: center; font-weight: 700;
}
.btn {
  appearance: none; border: 0; cursor: pointer;
  border-radius: 14px; padding: 14px 18px; font-weight: 700; font-size: 15px;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  transition: transform .12s ease, filter .12s ease, background .12s ease;
}
.btn:active { transform: scale(.98); }
.btn-brass { background: linear-gradient(180deg, #e4cc86, #c4a35a); color: #1a1406; width: 100%; margin-top: 12px; height: 52px; }
.btn-primary { background: var(--forest); color: #f4efe4; }
.btn-ghost { background: transparent; border: 1px solid var(--line); color: var(--ink); }
.btn-soft { background: var(--mint); color: var(--forest); }
.btn-danger { background: var(--danger-soft); color: var(--danger); }
.btn-ok { background: var(--ok); color: white; }
.btn-sm { height: 38px; padding: 0 12px; border-radius: 11px; font-size: 13px; }
.hint { font-size: 12px; color: #b7c2bb; margin: 14px 2px 0; }
.install-box {
  margin-top: 22px; padding: 14px 16px; border-radius: 16px;
  background: rgba(255,255,255,.06); border: 1px solid rgba(232,213,163,.2);
  font-size: 13.5px; line-height: 1.45;
}
.install-box ol { margin: 8px 0 0; padding-left: 18px; }
.install-box li { margin: 6px 0; }
.install-box code { color: #e8d5a3; }
.qr-wrap { text-align: center; margin-top: 12px; }
.qr-wrap img { width: 168px; height: 168px; background: #fff; padding: 8px; border-radius: 12px; }
.err { color: #ffb4a8; font-size: 13px; margin-top: 10px; min-height: 18px; }

/* SHELL */
.shell { min-height: 100dvh; padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom) + 12px); }
.top {
  position: sticky; top: 0; z-index: 20;
  background: rgba(243,238,228,.9); backdrop-filter: blur(14px);
  border-bottom: 1px solid rgba(230,221,207,.8);
  padding: 12px 16px 10px;
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
}
.brand { display: flex; align-items: center; gap: 10px; }
.brand img { width: 36px; height: 36px; border-radius: 10px; object-fit: cover; }
.brand .name { font-family: var(--display); font-size: 22px; font-weight: 650; letter-spacing: -.03em; line-height: 1; }
.brand .sub { font-size: 11px; color: var(--muted); letter-spacing: .04em; }
.icon-btn {
  width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--card); display: grid; place-items: center; cursor: pointer;
}
.page { padding: 16px; max-width: 920px; margin: 0 auto; }
.page-wide { max-width: 1100px; }

h2.page-title {
  font-family: var(--display); font-size: 30px; margin: 4px 0 4px; letter-spacing: -.03em;
}
.lede { color: var(--muted); margin: 0 0 16px; font-size: 14px; }

/* NAV */
.nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  height: calc(var(--nav-h) + env(safe-area-inset-bottom));
  padding-bottom: env(safe-area-inset-bottom);
  background: #fffdf8; border-top: 1px solid var(--line);
  display: grid; grid-template-columns: repeat(5, 1fr);
}
.nav button {
  border: 0; background: transparent; color: var(--muted);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  font-size: 10px; font-weight: 700; letter-spacing: .02em;
}
.nav button svg { width: 22px; height: 22px; }
.nav button.active { color: var(--forest); }
.nav button.active svg { stroke: var(--leaf); }

/* CARDS / UI */
.grid-kpi { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.kpi {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 14px 14px 12px; box-shadow: var(--shadow);
}
.kpi .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; }
.kpi .val { font-family: var(--display); font-size: 22px; margin-top: 6px; letter-spacing: -.03em; }
.kpi.warn { background: linear-gradient(180deg, #fff8ea, #fffdf8); }
.kpi.danger { background: linear-gradient(180deg, #fff1ee, #fffdf8); }
.kpi.ok { background: linear-gradient(180deg, #eef8f2, #fffdf8); }
.kpi.span { grid-column: 1 / -1; background: var(--forest); color: #f4efe4; border-color: transparent; }
.kpi.span .lbl { color: #d8c89a; }
.section-h {
  display: flex; align-items: baseline; justify-content: space-between; margin: 22px 0 10px;
}
.section-h h3 { margin: 0; font-size: 16px; }
.section-h a, .section-h button.link {
  border: 0; background: none; color: var(--leaf); font-weight: 700; font-size: 13px; cursor: pointer;
}
.list { display: flex; flex-direction: column; gap: 8px; }
.row {
  background: var(--card); border: 1px solid var(--line); border-radius: 16px;
  padding: 12px 14px; display: flex; gap: 12px; align-items: center; cursor: pointer;
}
.row:active { transform: scale(.995); }
.row .meta { flex: 1; min-width: 0; }
.row .title { font-weight: 700; font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
.row .amt { font-weight: 800; font-size: 14px; white-space: nowrap; }
.pill {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 11px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase;
  padding: 4px 8px; border-radius: 999px;
}
.pill.borrador { background: #eeeae2; color: #4d5752; }
.pill.enviado { background: var(--info-soft); color: var(--info); }
.pill.aceptado { background: var(--ok-soft); color: var(--ok); }
.pill.rechazado, .pill.vencida, .pill.vencido { background: var(--danger-soft); color: var(--danger); }
.pill.pendiente { background: var(--warn-soft); color: var(--warn); }
.pill.pagada { background: var(--ok-soft); color: var(--ok); }

.search {
  width: 100%; height: 46px; border-radius: 14px; border: 1px solid var(--line);
  background: var(--card); padding: 0 14px; font-size: 15px; margin-bottom: 12px;
}
.filters { display: flex; gap: 8px; overflow: auto; padding-bottom: 10px; }
.chip {
  border: 1px solid var(--line); background: var(--card); border-radius: 999px;
  padding: 7px 12px; font-size: 12px; font-weight: 700; white-space: nowrap; cursor: pointer;
}
.chip.on { background: var(--forest); color: #f4efe4; border-color: var(--forest); }

.form { display: flex; flex-direction: column; gap: 12px; }
.field label {
  display: block; font-size: 11px; font-weight: 800; letter-spacing: .08em;
  text-transform: uppercase; color: var(--muted); margin-bottom: 6px;
}
.field input, .field select, .field textarea {
  width: 100%; border: 1px solid var(--line); background: var(--card);
  border-radius: 12px; padding: 11px 12px; font-size: 15px; color: var(--ink);
}
.field textarea { min-height: 88px; resize: vertical; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.three { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.card {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 14px; box-shadow: var(--shadow);
}
.item-line {
  border: 1px dashed #d7cdb8; border-radius: 14px; padding: 10px; margin-bottom: 8px; background: #fff;
}
.item-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.totales { margin-top: 8px; }
.totales .line { display: flex; justify-content: space-between; padding: 6px 0; color: var(--muted); font-size: 14px; }
.totales .line.strong {
  color: var(--ink); font-size: 20px; font-family: var(--display); border-top: 1px solid var(--line); padding-top: 10px; margin-top: 4px;
}
.pay-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.pay-opt {
  border: 1px solid var(--line); background: #fff; border-radius: 14px; padding: 10px 8px; text-align: center; cursor: pointer;
}
.pay-opt.on { border-color: var(--leaf); background: var(--mint); }
.pay-opt b { display: block; font-size: 13px; }
.pay-opt span { font-size: 11px; color: var(--muted); }
.fab {
  position: fixed; right: 16px; bottom: calc(var(--nav-h) + env(safe-area-inset-bottom) + 16px);
  height: 54px; padding: 0 18px; border-radius: 999px; border: 0;
  background: var(--forest); color: #f4efe4; font-weight: 800; box-shadow: 0 12px 24px rgba(14,42,34,.28);
  display: flex; align-items: center; gap: 8px; z-index: 25; cursor: pointer;
}
.toast {
  position: fixed; left: 50%; bottom: calc(var(--nav-h) + 18px); transform: translateX(-50%);
  background: var(--ink); color: #fff; padding: 10px 14px; border-radius: 12px; font-size: 13px;
  z-index: 80; opacity: 0; pointer-events: none; transition: opacity .2s;
}
.toast.show { opacity: 1; }
.empty {
  text-align: center; padding: 28px 10px; color: var(--muted);
}
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.modal-bg {
  position: fixed; inset: 0; background: rgba(12, 22, 18, .45); z-index: 60;
  display: flex; align-items: flex-end; justify-content: center;
}
.modal {
  background: var(--paper); width: 100%; max-width: 560px; border-radius: 22px 22px 0 0;
  padding: 18px 16px calc(18px + env(safe-area-inset-bottom));
  max-height: 88dvh; overflow: auto;
}
.modal h3 { margin: 0 0 12px; font-family: var(--display); font-size: 24px; }
.logo-preview { width: 72px; height: 72px; object-fit: cover; border-radius: 14px; border: 1px solid var(--line); background: #fff; }

/* PDF / PRINT */
.pdf-page {
  background: #fff; color: #111; width: 210mm; max-width: 100%;
  margin: 0 auto 20px; padding: 14mm 14mm 12mm;
  box-shadow: var(--shadow); border: 1px solid var(--line);
  font-size: 11.5px; line-height: 1.35;
}
.pdf-top {
  display: grid; grid-template-columns: 1fr 200px; gap: 12px; align-items: start;
  border-bottom: 2px solid #0e2a22; padding-bottom: 12px;
}
.pdf-letter {
  width: 72px; height: 72px; border: 2.5px solid #0e2a22; display: grid; place-items: center;
  font-family: var(--display); font-size: 42px; font-weight: 650; line-height: 1;
}
.pdf-letter small { display: block; font-family: var(--font); font-size: 8px; letter-spacing: .14em; font-weight: 800; margin-top: 2px; }
.pdf-brand { display: flex; gap: 12px; align-items: flex-start; }
.pdf-logo { width: 64px; height: 64px; object-fit: contain; border-radius: 8px; }
.pdf-co .fantasia { font-family: var(--display); font-size: 22px; letter-spacing: -.03em; line-height: 1.1; }
.pdf-co .rs { font-weight: 700; margin-top: 2px; }
.pdf-co .fisc { color: #444; font-size: 10.5px; margin-top: 6px; }
.pdf-badge {
  border: 1.5px solid #0e2a22; text-align: center; padding: 8px 8px 10px; border-radius: 4px;
}
.pdf-badge .k { font-size: 10px; letter-spacing: .16em; font-weight: 800; }
.pdf-badge .n { font-family: var(--display); font-size: 18px; margin-top: 4px; }
.pdf-badge .d { font-size: 10.5px; color: #333; margin-top: 6px; }
.pdf-client {
  display: grid; grid-template-columns: 1.3fr .7fr; gap: 12px; margin: 12px 0;
}
.pdf-box { border: 1px solid #d8d1c4; padding: 8px 10px; border-radius: 4px; }
.pdf-box .k { font-size: 9px; letter-spacing: .12em; font-weight: 800; color: #666; }
.pdf-table { width: 100%; border-collapse: collapse; margin-top: 4px; }
.pdf-table th {
  background: #0e2a22; color: #f4efe4; font-size: 10px; letter-spacing: .06em;
  text-transform: uppercase; padding: 6px 6px; text-align: left; font-weight: 700;
}
.pdf-table td { padding: 6px; border-bottom: 1px solid #ece6da; vertical-align: top; }
.pdf-table td.num, .pdf-table th.num { text-align: right; white-space: nowrap; }
.pdf-foot { display: grid; grid-template-columns: 1.2fr .8fr; gap: 16px; margin-top: 12px; }
.pdf-cuotas { width: 100%; border-collapse: collapse; font-size: 11px; }
.pdf-cuotas th, .pdf-cuotas td { border: 1px solid #d8d1c4; padding: 5px 6px; }
.pdf-tot { width: 100%; }
.pdf-tot td { padding: 4px 0; }
.pdf-tot .big { font-family: var(--display); font-size: 20px; border-top: 2px solid #0e2a22; padding-top: 6px; }
.pdf-sign { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-top: 28px; }
.pdf-sign .line { border-top: 1px solid #888; padding-top: 6px; font-size: 10px; color: #555; }
.pdf-legal { margin-top: 16px; font-size: 9.5px; color: #666; }
.pdf-toolbar {
  position: sticky; top: 58px; z-index: 15; display: flex; gap: 8px; flex-wrap: wrap;
  padding: 8px 0 12px; background: var(--cream);
}

@media (max-width: 720px) {
  .pdf-page { padding: 12px; width: 100%; }
  .pdf-top { grid-template-columns: 1fr; }
  .pdf-client, .pdf-foot, .pdf-sign { grid-template-columns: 1fr; }
  .two, .three, .pay-grid { grid-template-columns: 1fr 1fr; }
}

@page { size: A4 portrait; margin: 10mm; }
@media print {
  html, body { background: #fff !important; width: 210mm; }
  .shell > .top, .nav, .fab, .pdf-toolbar, .toast, .no-print, .login { display: none !important; }
  .shell { padding: 0; min-height: 0; }
  .page, .page-wide { padding: 0; max-width: none; margin: 0; }
  .pdf-page {
    box-shadow: none; border: 0; width: 190mm; min-height: 277mm;
    margin: 0; padding: 0; font-size: 11px;
  }
}

.paywall {
  min-height: 70dvh; display: flex; flex-direction: column; justify-content: center;
  text-align: center; padding: 24px 10px;
}
.paywall h2 { font-family: var(--display); font-size: 32px; margin: 0 0 8px; }
.lic-bar { font-size: 12px; color: var(--muted); font-weight: 700; }
.iva-box {
  border: 2px solid var(--leaf) !important;
  background: var(--mint) !important;
  padding: 12px !important;
  border-radius: 14px;
}
.iva-box label { color: var(--forest) !important; }

.tiny { font-size: 12px; color: var(--muted); }
.right { text-align: right; }
.grow { flex: 1; }
hr.sep { border: 0; border-top: 1px solid var(--line); margin: 16px 0; }
.switch-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }

/* ARCA FACTURA ELECTRÓNICA */
.pdf-arca-top {
  display: grid;
  grid-template-columns: 1.15fr 74px 1.15fr;
  gap: 8px;
  align-items: stretch;
  border: 2px solid #0e2a22;
  border-radius: 6px;
  padding: 8px 10px;
  margin-bottom: 10px;
  background: #fff;
}
.pdf-arca-letter-box {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  border: 2px solid #0e2a22;
  border-radius: 4px;
  background: #fbf8f2;
  padding: 2px;
  text-align: center;
  align-self: center;
  height: 68px;
}
.pdf-arca-letter-box .letter {
  font-family: var(--display);
  font-size: 34px;
  font-weight: 700;
  line-height: 1;
}
.pdf-arca-letter-box .cod {
  font-size: 8px;
  font-weight: 800;
  letter-spacing: 0.08em;
  margin-top: 2px;
}
.pdf-arca-footer {
  margin-top: 14px;
  border-top: 1.5px solid #0e2a22;
  padding-top: 10px;
  display: grid;
  grid-template-columns: 105px 1fr 180px;
  gap: 12px;
  align-items: center;
}
.pdf-arca-logo {
  font-family: var(--display);
  font-size: 22px;
  font-weight: 800;
  color: #0e2a22;
  letter-spacing: 0.04em;
  line-height: 1;
}
.pdf-arca-sub {
  font-size: 8px;
  color: #555;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
.pill.facturado { background: #d9f0e4; color: #1b7a4c; font-weight: 700; }
.pill.emitida { background: #d9f0e4; color: #1b7a4c; font-weight: 700; }

</style>
</head>

  function ensureDb(db) {
    if (!db || typeof db !== "object") db = seed();
    if (!db.settings) db.settings = seed().settings;
    if (!db.settings.pin) db.settings.pin = "1234";
    if (!db.adminPin) db.adminPin = "2468";
    if (!db.settings.puntoVentaArca) db.settings.puntoVentaArca = "00002";
    if (!db.settings.proximaFacturaA) db.settings.proximaFacturaA = 1;
    if (!db.settings.proximaFacturaB) db.settings.proximaFacturaB = 1;
    if (!db.settings.proximaFacturaC) db.settings.proximaFacturaC = 1;
    if (!db.saas || typeof db.saas !== "object") db.saas = defaultSaas();
    if (!Array.isArray(db.saas.talleres)) db.saas.talleres = defaultSaas().talleres;
    if (!Array.isArray(db.saas.pagos)) db.saas.pagos = [];
    if (!db.saas.planes) db.saas.planes = defaultSaas().planes;
    if (!db.saas.cobro) db.saas.cobro = defaultSaas().cobro;
    if (!db.saas.admin) db.saas.admin = defaultSaas().admin;
    if (!Array.isArray(db.clients)) db.clients = [];
    if (!Array.isArray(db.catalog)) db.catalog = [];
    if (!Array.isArray(db.quotes)) db.quotes = [];
    if (!Array.isArray(db.installments)) db.installments = [];
    if (!Array.isArray(db.remitos)) db.remitos = [];
    if (!Array.isArray(db.facturas)) db.facturas = [];
    return db;
  }

  function load() {
    try {
      const raw = localStorage.getItem(KEY) || localStorage.getItem(KEY_OLD);
      if (raw) {
        const db = ensureDb(JSON.parse(raw));
        save(db);
        return db;
      }
    } catch (e) {}
    const db = ensureDb(seed());
    save(db);
    return db;
  }
  function save(db) {
    localStorage.setItem(KEY, JSON.stringify(db));
  }

  function withQuote(db, q) {
    const totals = totalsOf(q);
    const inst = db.installments.filter((i) => i.quoteId === q.id).sort((a, b) => a.n - b.n);
    const cobrado = inst.filter((i) => i.status === "pagada").reduce((s, i) => s + i.amount, 0);
    return { ...q, totals, installments: inst, cobrado, saldo: round2(totals.total - cobrado) };
  }

  function rebuild(db, quote, keepPaid) {
    const existing = db.installments.filter((i) => i.quoteId === quote.id);
    const paid = keepPaid ? existing.filter((i) => i.status === "pagada") : [];
    db.installments = db.installments.filter((i) => i.quoteId !== quote.id);
    if (quote.status !== "aceptado" && quote.status !== "enviado" && quote.status !== "facturado") return;
    const totals = totalsOf(quote);
    const days = planDays(quote.pagoTipo || "30-60-90");
    const anticipo = Math.min(Number(quote.anticipo || 0), totals.total);
    const resto = Math.max(0, totals.total - anticipo);
    const raw = days.length ? round2(resto / days.length) : 0;
    const created = [];

    // Base date: Si ya tiene factura emitida, se computan los 30, 60, 90 días a partir de la emisión de la factura
    const baseFecha = quote.facturaFecha || quote.fecha || todayISO();

    if (anticipo > 0) {
      created.push({
        id: uid("cuo_"),
        quoteId: quote.id,
        facturaId: quote.facturaId || "",
        facturaNumero: quote.facturaNumero || "",
        n: 0,
        label: "Anticipo",
        dueDate: quote.fecha,
        amount: anticipo,
        status: "pendiente",
        paidAt: "",
        method: "",
        notes: "",
      });
    }
    days.forEach((d, idx) => {
      let label = d === 0 ? "Contado" : `${d} días`;
      if (quote.facturaNumero && d > 0) {
        label = `Cuota ${idx + 1} (${d} días f/factura)`;
      }
      created.push({
        id: uid("cuo_"),
        quoteId: quote.id,
        facturaId: quote.facturaId || "",
        facturaNumero: quote.facturaNumero || "",
        n: idx + 1,
        label: label,
        dueDate: addDays(baseFecha, d),
        amount: idx === days.length - 1 ? round2(resto - raw * (days.length - 1)) : raw,
        status: "pendiente",
        paidAt: "",
        method: "",
        notes: "",
      });
    });
    paid.forEach((p) => {
      const match = created.find((c) => c.n === p.n && c.status !== "pagada");
      if (match) {
        match.status = "pagada";
        match.paidAt = p.paidAt;
        match.method = p.method;
        match.notes = p.notes;
      }
    });
    db.installments.push(...created);
  }

  function refresh(db) {
    const today = todayISO();
    db.installments.forEach((i) => {
      if (i.status === "pendiente" && i.dueDate < today) i.status = "vencida";
      if (!i.label) i.label = i.n === 0 ? "Anticipo" : "Cuota " + i.n;
    });
  }

  function parsePath(path) {
    const u = new URL(path, "http://local");
    return { path: u.pathname, query: Object.fromEntries(u.searchParams.entries()) };
  }

  function fileToDataUrl(file) {
    return new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = () => res(r.result);
      r.onerror = rej;
      r.readAsDataURL(file);
    });
  }

  window.PLAZO_OFFLINE = true;
  window.plazoOffline = async function (rawPath, opts = {}) {
    const method = (opts.method || "GET").toUpperCase();
    const { path, query } = parsePath(rawPath);
    const db = load();
    refresh(db);
    const body = opts.body instanceof FormData ? opts.body : opts.body || {};

    const ok = (data) => data;
    const fail = (msg) => {
      const e = new Error(msg);
      throw e;
    };

    function licenseOf(t) {
      if (!t) return { ok: false, estado: "inexistente", dias: 0 };
      if (t.estado === "suspendido") return { ok: false, estado: "suspendido", dias: 0, hasta: t.licenciaHasta };
      const today = todayISO();
      const dias = Math.ceil((new Date(t.licenciaHasta + "T12:00:00") - new Date(today + "T12:00:00")) / 86400000);
      if (dias < 0) return { ok: false, estado: "vencido", dias, hasta: t.licenciaHasta, plan: t.plan };
      return { ok: true, estado: "activo", dias, hasta: t.licenciaHasta, plan: t.plan };
    }
    function publicTaller(t) {
      return { ...t, licencia: licenseOf(t) };
    }

    if (path === "/api/login" && method === "POST") {
      const usuario = String(body.usuario || "").trim().toLowerCase();
      const pin = String(body.pin || "").replace(/\s/g, "");
      if (!usuario || !pin) fail("Completá usuario y PIN. Estudio: admin / 2468. Cliente: taller / 1234");

      const adminPin = String(db.adminPin || "2468");
      const isAdminUser = ["admin", "estudio", "dueño", "dueno"].includes(usuario);
      if (isAdminUser && pin === adminPin) {
        sessionStorage.setItem(SESSION, "admin");
        sessionStorage.setItem(ROLE, "admin");
        return ok({
          token: "local-admin",
          role: "admin",
          admin: db.saas.admin,
          planes: db.saas.planes,
          cobro: db.saas.cobro,
        });
      }
      // Si pusieron el PIN del estudio con otro usuario, igual entran al estudio
      if (pin === adminPin && !isAdminUser) {
        sessionStorage.setItem(SESSION, "admin");
        sessionStorage.setItem(ROLE, "admin");
        return ok({
          token: "local-admin",
          role: "admin",
          admin: db.saas.admin,
          planes: db.saas.planes,
          cobro: db.saas.cobro,
        });
      }

      const aliasTaller = ["taller", "talleres", "cliente", "user"];
      const lista = db.saas.talleres || [];
      let t = lista.find((x) => String(x.usuario || "").toLowerCase() === usuario);
      if (!t && aliasTaller.includes(usuario)) t = lista[0] || null;
      const tallerPin = String((t && t.pin) || db.settings.pin || "1234");
      if (t && pin === tallerPin) {
        sessionStorage.setItem(SESSION, t.id);
        sessionStorage.setItem(ROLE, "taller");
        return ok({
          token: "local-taller",
          role: "taller",
          taller: publicTaller(t),
          licencia: licenseOf(t),
          settings: publicSettings(db.settings),
          cobro: db.saas.cobro,
          adminWhatsapp: (db.saas.admin && db.saas.admin.whatsapp) || "",
        });
      }
      fail("No coinciden. Estudio: usuario admin y PIN 2468. Cliente: usuario taller y PIN 1234");
    }
    if (path === "/api/logout") {
      sessionStorage.removeItem(SESSION);
      sessionStorage.removeItem(ROLE);
      return ok({ ok: true });
    }
    if (!sessionStorage.getItem(SESSION) && path !== "/api/login") fail("Sesión vencida");
    const role = sessionStorage.getItem(ROLE) || "taller";

    if (path === "/api/me") {
      if (role === "admin") {
        return ok({ role: "admin", admin: db.saas.admin, planes: db.saas.planes, cobro: db.saas.cobro });
      }
      const t = (db.saas.talleres || [])[0];
      return ok({
        role: "taller",
        taller: publicTaller(t),
        licencia: licenseOf(t),
        settings: publicSettings(db.settings),
        cobro: db.saas.cobro,
        adminWhatsapp: db.saas.admin.whatsapp || "",
      });
    }

    if (path === "/api/settings") {
      if (method === "PUT") {
        Object.assign(db.settings, body);
        if (body.puntoVenta) db.settings.puntoVenta = String(body.puntoVenta).replace(/\D/g, "").padStart(5, "0").slice(-5);
        if (body.proximoNumero !== undefined) db.settings.proximoNumero = Math.max(1, parseInt(body.proximoNumero, 10) || 1);
        if (body.proximoRemito !== undefined) db.settings.proximoRemito = Math.max(1, parseInt(body.proximoRemito, 10) || 1);
        save(db);
      }
      return ok(publicSettings(db.settings));
    }
    if (path === "/api/settings/pin" && method === "POST") {
      if (String(body.actual) !== String(db.settings.pin)) fail("El PIN actual no coincide.");
      if (!body.nuevo || String(body.nuevo).length < 4) fail("El PIN nuevo debe tener al menos 4 dígitos.");
      db.settings.pin = String(body.nuevo);
      save(db);
      return ok({ ok: true });
    }
    if (path === "/api/settings/logo" && method === "POST") {
      const f = body.get && body.get("logo");
      if (!f) fail("No se recibió imagen.");
      db.settings.logoDataUrl = await fileToDataUrl(f);
      save(db);
      return ok({ logoDataUrl: db.settings.logoDataUrl });
    }

    if (path === "/api/dashboard") {
      save(db);
      const today = todayISO();
      const month = today.slice(0, 7);
      const inst = db.installments;
      const sum = (arr) => round2(arr.reduce((s, i) => s + Number(i.amount || 0), 0));
      const vencido = inst.filter((i) => i.status === "vencida" || (i.status === "pendiente" && i.dueDate < today));
      const mapI = (i) => {
        const q = db.quotes.find((x) => x.id === i.quoteId);
        return { ...i, cliente: q?.clientSnapshot?.nombre || "Cliente", numero: q?.numero };
      };
      return ok({
        today,
        kpis: {
          porCobrarMes: sum(inst.filter((i) => i.status !== "pagada" && i.dueDate.slice(0, 7) === month)),
          vencido: sum(vencido),
          cobradoMes: sum(inst.filter((i) => i.status === "pagada" && (i.paidAt || "").slice(0, 7) === month)),
          presupuestosMes: db.quotes.filter((q) => (q.fecha || "").slice(0, 7) === month).length,
          aceptados: db.quotes.filter((q) => q.status === "aceptado").length,
          saldoTotal: sum(inst.filter((i) => i.status !== "pagada")),
        },
        proximos: inst
          .filter((i) => i.status !== "pagada" && i.dueDate >= today)
          .sort((a, b) => a.dueDate.localeCompare(b.dueDate))
          .slice(0, 8)
          .map(mapI),
        vencidos: vencido.sort((a, b) => a.dueDate.localeCompare(b.dueDate)).slice(0, 8).map(mapI),
        recientes: [...db.quotes]
          .sort((a, b) => (b.updatedAt || "").localeCompare(a.updatedAt || ""))
          .slice(0, 6)
          .map((q) => withQuote(db, q)),
        counts: { clientes: db.clients.length, presupuestos: db.quotes.length, catalogo: db.catalog.length },
      });
    }

    if (path === "/api/clients") {
      if (method === "POST") {
        if (!body.nombre) fail("El nombre es obligatorio.");
        if (!body.condicionIva) fail("Elegí la condición impositiva del cliente.");
        const c = {
          id: uid("cli_"),
          nombre: String(body.nombre).trim(),
          docTipo: body.docTipo || "DNI",
          docNro: body.docNro || "",
          condicionIva: body.condicionIva || "Consumidor Final",
          domicilio: body.domicilio || "",
          localidad: body.localidad || "",
          telefono: body.telefono || "",
          email: body.email || "",
          whatsapp: String(body.whatsapp || "").replace(/\D/g, ""),
          notas: body.notas || "",
          createdAt: new Date().toISOString(),
        };
        db.clients.push(c);
        save(db);
        return ok(c);
      }
      let list = db.clients.slice().sort((a, b) => a.nombre.localeCompare(b.nombre, "es"));
      const q = (query.q || "").toLowerCase();
      if (q) list = list.filter((c) => JSON.stringify(c).toLowerCase().includes(q));
      return ok(list);
    }
    const cli = path.match(/^\/api\/clients\/([^/]+)$/);
    if (cli) {
      const c = db.clients.find((x) => x.id === cli[1]);
      if (!c) fail("Cliente no encontrado.");
      if (method === "DELETE") {
        db.clients = db.clients.filter((x) => x.id !== cli[1]);
        save(db);
        return ok({ ok: true });
      }
      ["nombre", "docTipo", "docNro", "domicilio", "localidad", "telefono", "email", "whatsapp", "notas"].forEach((k) => {
        if (body[k] !== undefined) c[k] = k === "whatsapp" ? String(body[k]).replace(/\D/g, "") : body[k];
      });
      save(db);
      return ok(c);
    }

    if (path === "/api/catalog") {
      if (method === "POST") {
        if (!body.descripcion) fail("La descripción es obligatoria.");
        const item = {
          id: uid("cat_"),
          codigo: body.codigo || "",
          descripcion: String(body.descripcion).trim(),
          unidad: body.unidad || "un",
          precio: Number(body.precio || 0),
          createdAt: new Date().toISOString(),
        };
        db.catalog.push(item);
        save(db);
        return ok(item);
      }
      return ok(db.catalog.slice().sort((a, b) => a.descripcion.localeCompare(b.descripcion, "es")));
    }
    const cat = path.match(/^\/api\/catalog\/([^/]+)$/);
    if (cat) {
      const it = db.catalog.find((x) => x.id === cat[1]);
      if (!it) fail("Ítem no encontrado.");
      if (method === "DELETE") {
        db.catalog = db.catalog.filter((x) => x.id !== cat[1]);
        save(db);
        return ok({ ok: true });
      }
      ["codigo", "descripcion", "unidad", "precio"].forEach((k) => {
        if (body[k] !== undefined) it[k] = k === "precio" ? Number(body[k]) : body[k];
      });
      save(db);
      return ok(it);
    }

    function normalizeItems(items) {
      return (items || [])
        .filter((it) => String(it.descripcion || "").trim())
        .map((it) => ({
          id: it.id || uid("it_"),
          descripcion: String(it.descripcion).trim(),
          cantidad: Number(it.cantidad || 0),
          unidad: it.unidad || "un",
          precio: Number(it.precio || 0),
          iva: Number(it.iva || 0),
        }));
    }

    if (path === "/api/quotes") {
      if (method === "POST") {
        const client = db.clients.find((c) => c.id === body.clientId);
        if (!client) fail("Elegí un cliente.");
        const items = normalizeItems(body.items);
        if (!items.length) fail("Agregá al menos un ítem.");
        const pv = db.settings.puntoVenta || "00001";
        const nro = Number(db.settings.proximoNumero || 1);
        const fecha = body.fecha || todayISO();
        const validez = Number(body.validezDias ?? db.settings.validezDias ?? 15);
        const quote = {
          id: uid("pre_"),

          fecha,
          validezHasta: addDays(fecha, validez),
          clientId: client.id,
          clientSnapshot: { ...client },
          items,
          descuentoTipo: body.descuentoTipo || "percent",
          descuentoValor: Number(body.descuentoValor || 0),
          ivaPct: Number(body.ivaPct ?? db.settings.ivaPct ?? 0),
          pagoTipo: body.pagoTipo || "30-60-90",
          anticipo: Number(body.anticipo || 0),
          observaciones: body.observaciones || "",
          condiciones: body.condiciones || db.settings.condicionesDefault,
          status: body.status || "borrador",
          createdAt: new Date().toISOString(),
          updatedAt: new Date().toISOString(),
        };
        db.settings.proximoNumero = nro + 1;
        db.quotes.push(quote);
        if (quote.status === "aceptado" || quote.status === "enviado") rebuild(db, quote, false);
        save(db);
        return ok(withQuote(db, quote));
      }
      let list = db.quotes.slice().sort((a, b) => (b.fecha + b.numero).localeCompare(a.fecha + a.numero));
      if (query.status && query.status !== "todos") list = list.filter((x) => x.status === query.status);
      const q = (query.q || "").toLowerCase();
      if (q) list = list.filter((x) => [x.numero, x.clientSnapshot?.nombre, x.observaciones].join(" ").toLowerCase().includes(q));
      save(db);

        exportedAt: new Date().toISOString(),
        settings,
        clients: db.clients || [],

        quotes: db.quotes || [],
        installments: db.installments || [],
        remitos: db.remitos || [],
        facturas: db.facturas || [],

    }
    if (path === "/api/import" && method === "POST") {
      if (!body.quotes && !body.clients && !body.facturas) fail("Archivo de respaldo inválido.");
      if (body.settings) Object.assign(db.settings, body.settings);
      if (Array.isArray(body.clients)) db.clients = body.clients;
      if (Array.isArray(body.catalog)) db.catalog = body.catalog;
      if (Array.isArray(body.quotes)) db.quotes = body.quotes;

    }

  <script>/* PLAZO — presupuestos y cobranzas */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];

const state = {
  token: localStorage.getItem("plazo_token") || "",
  settings: null,
  role: localStorage.getItem("plazo_role") || "",
  licencia: null,
  cobro: null,
  adminWhatsapp: "",
  route: "inicio",
  params: {},
  deferredPrompt: null,
};

const IVA_OPTS = ["Consumidor Final", "Monotributo", "Responsable Inscripto", "Exento", "No responsable", "Cliente del Exterior"];

function ivaSelect(val) {
  return `<select name="condicionIva" required>${IVA_OPTS.map((x) => `<option ${val === x ? "selected" : ""}>${x}</option>`).join("")}</select>`;
}
window.ivaSelect = ivaSelect;

const money = (n) =>
  new Intl.NumberFormat("es-AR", { style: "currency", currency: "ARS", maximumFractionDigits: 2 }).format(Number(n || 0));
const moneyShort = (n) =>
  new Intl.NumberFormat("es-AR", { style: "currency", currency: "ARS", maximumFractionDigits: 0 }).format(Number(n || 0));
const dAR = (iso) => {
  if (!iso) return "—";
  const [y, m, d] = String(iso).slice(0, 10).split("-");
  return `${d}/${m}/${y}`;
};
window.dAR = dAR;

const todayISO = () => {
  const d = new Date();
  const off = d.getTimezoneOffset();
  return new Date(d.getTime() - off * 60000).toISOString().slice(0, 10);
};
window.todayISO = todayISO;

const addDays = (iso, days) => {
  if (!iso) iso = todayISO();
  const [y, m, d] = String(iso).slice(0, 10).split("-").map(Number);
  const dt = new Date(y, (m || 1) - 1, d || 1);
  dt.setDate(dt.getDate() + Number(days || 0));
  return `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, "0")}-${String(dt.getDate()).padStart(2, "0")}`;
};
window.addDays = addDays;

const round2 = (n) => Math.round((Number(n || 0) + Number.EPSILON) * 100) / 100;
window.round2 = round2;

const pad = (n, len) => String(n ?? "").padStart(len, "0");
window.pad = pad;

const planDays = (tipo) => {
  if (tipo === "contado") return [0];
  if (tipo === "30") return [30];
  if (tipo === "60") return [60];
  if (tipo === "90") return [90];
  if (tipo === "30-60") return [30, 60];
  return [30, 60, 90];
};
window.planDays = planDays;
const esc = (s) =>
  String(s ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
const cuitFmt = (c) => {
  const d = String(c || "").replace(/\D/g, "");
  if (d.length !== 11) return c || "—";
  return `${d.slice(0, 2)}-${d.slice(2, 10)}-${d.slice(10)}`;
};

function toast(msg) {
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2400);
}

function appIcon() {
  return (state.settings && state.settings.logoDataUrl) || window.PLAZO_ICON || "/icons/icon-192.png";
}

async function api(path, opts = {}) {
  if (window.PLAZO_OFFLINE && window.plazoOffline) {
    try {
      return await window.plazoOffline(path, opts);
    } catch (err) {
      if (String(err.message || "").includes("Sesión vencida")) logout(false);
      throw err;
    }
  }
  const headers = { ...(opts.headers || {}) };
  if (state.token) headers.Authorization = "Bearer " + state.token;
  if (opts.body && !(opts.body instanceof FormData) && !headers["Content-Type"]) {
    headers["Content-Type"] = "application/json";
  }
  const res = await fetch(path, {
    ...opts,
    headers,
    body: opts.body instanceof FormData ? opts.body : opts.body ? JSON.stringify(opts.body) : undefined,
  });
  if (res.status === 401) {
    logout(false);
    throw new Error("Sesión vencida");
  }
  const data = await res.json().catch(() => ({}));
  if (res.status === 402) {
    state.licencia = data.licencia || { estado: "vencido", ok: false };
    if (state.route !== "paywall") go("paywall");
    throw new Error(data.error || "Licencia vencida");
  }
  if (!res.ok) throw new Error(data.error || "Error de red");
  return data;
}

function logout(call) {
  if (call && state.token) api("/api/logout", { method: "POST" }).catch(() => {});
  state.token = "";
  state.role = "";
  state.settings = null;
  localStorage.removeItem("plazo_token");
  localStorage.removeItem("plazo_role");
  $("#app").classList.add("app-hidden");
  $("#login").classList.remove("app-hidden");
}

function go(route, params = {}) {
  state.route = route;
  state.params = params;
  location.hash = params.id ? `#/${route}/${params.id}${params.extra ? "/" + params.extra : ""}` : `#/${route}`;
  render();
}

function parseHash() {
  const h = (location.hash || "#/inicio").replace(/^#\/?/, "");
  const [route = "inicio", id, extra] = h.split("/");
  state.route = route || "inicio";
  state.params = { id, extra };
}

  return { generateSvg: generateSvg };
})();

function makeArcaQrSvg(fac) {
  try {
    const cuitEmisor = Number(String(fac?.emisor?.cuit || "").replace(/\D/g, "")) || 20000000001;
    const cuitCliente = Number(String(fac?.clientSnapshot?.docNro || "").replace(/\D/g, "")) || 0;
    let tipoDocRec = 99;
    const dt = String(fac?.clientSnapshot?.docTipo || "").toUpperCase();
    if (dt === "CUIT") tipoDocRec = 80;
    else if (dt === "CUIL") tipoDocRec = 86;
    else if (dt === "DNI") tipoDocRec = 96;

    const payload = {
      ver: 1,
      fecha: fac?.fecha || new Date().toISOString().slice(0, 10),
      cuit: cuitEmisor,
      ptoVta: Number(fac?.pv) || 2,
      tipoCmp: Number(fac?.tipoCmp) || 11,
      nroCmp: Number(fac?.nro) || 1,
      importe: Number(fac?.totals?.total || 0),
      moneda: "PES",
      ctz: 1,
      tipoDocRec: tipoDocRec,
      nroDocRec: cuitCliente,
      tipoCodAut: "E",
      codAut: Number(fac?.cae) || 74000000000000
    };

    const jsonStr = JSON.stringify(payload);
    let base64 = "";
    try {
      base64 = btoa(unescape(encodeURIComponent(jsonStr)));
    } catch (e) {
      base64 = btoa(jsonStr);
    }
    const url = "https://www.afip.gob.ar/fe/qr/?p=" + base64;
    return { url: url, svg: ArcaQR.generateSvg(url, 105) };
  } catch (err) {
    console.error("Error en makeArcaQrSvg:", err);
    return {
      url: "https://www.afip.gob.ar",
      svg: "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"105\" height=\"105\" viewBox=\"0 0 105 105\"><rect width=\"105\" height=\"105\" fill=\"#fff\"/><text x=\"50%\" y=\"50%\" font-size=\"9\" text-anchor=\"middle\" fill=\"#555\">QR AFIP</text></svg>"
    };
  }
}

/* ==========================================================================
   Manejo de pegado en MAYÚSCULAS para conceptos / descripciones de presupuestos
   ========================================================================== */
function isUpperConceptTarget(el) {
  if (!el || !(el instanceof HTMLElement)) return false;
  if (el.tagName !== "INPUT" && el.tagName !== "TEXTAREA") return false;
  if (el.name === "desc" || el.name === "descripcion") return true;
  if (el.hasAttribute && (el.hasAttribute("data-upper") || el.getAttribute("data-upper") === "true")) return true;
  if (el.closest && el.closest(".item-line") && el.name === "desc") return true;
  return false;
}

function insertUpperPastedText(target, text) {
  if (text == null) return;
  const upper = String(text).toUpperCase();
  let ok = false;
  try {
    if (document.queryCommandSupported && document.queryCommandSupported("insertText")) {
      ok = document.execCommand("insertText", false, upper);
    }
  } catch (_) {}

  if (!ok) {
    const start = target.selectionStart != null ? target.selectionStart : (target.value ? target.value.length : 0);
    const end = target.selectionEnd != null ? target.selectionEnd : (target.value ? target.value.length : 0);
    const val = target.value || "";
    target.value = val.slice(0, start) + upper + val.slice(end);
    const newPos = start + upper.length;
    if (typeof target.setSelectionRange === "function") {
      target.setSelectionRange(newPos, newPos);
    }
    target.dispatchEvent(new Event("input", { bubbles: true }));
    target.dispatchEvent(new Event("change", { bubbles: true }));
  }
}

// 1. Interceptar evento de pegado estándar (Desktop y menú contextual en móvil)
document.addEventListener("paste", function (e) {
  const target = e.target;
  if (!isUpperConceptTarget(target)) return;
  const clip = e.clipboardData || window.clipboardData;
  if (!clip) return;
  const text = clip.getData("text/plain") || clip.getData("text");
  if (text) {
    e.preventDefault();
    insertUpperPastedText(target, text);
  }
}, true);

// 2. Interceptar evento beforeinput (barra de portapapeles y teclados móviles Android/iOS)
document.addEventListener("beforeinput", function (e) {
  const target = e.target;
  if (!isUpperConceptTarget(target)) return;
  if (e.inputType === "insertFromPaste" || e.inputType === "insertReplacementText") {
    let text = "";
    if (e.dataTransfer) {
      text = e.dataTransfer.getData("text/plain") || e.dataTransfer.getData("text");
    } else if (typeof e.data === "string") {
      text = e.data;
    }
    if (text) {
      e.preventDefault();
      insertUpperPastedText(target, text);
    }
  }
}, true);

function totalsLocal(q) {
  const subtotal = (q.items || []).reduce((s, it) => s + Number(it.cantidad || 0) * Number(it.precio || 0), 0);
  const desc = q.descuentoTipo === "amount" ? Number(q.descuentoValor || 0) : subtotal * (Number(q.descuentoValor || 0) / 100);
  const base = Math.max(0, subtotal - desc);
  const iva = base * (Number(q.ivaPct || 0) / 100);
  return { subtotal, descuento: desc, base, iva, total: base + iva };
}

/* ==========================================================================
   Importador Inteligente de Mensajes de WhatsApp a Presupuesto
   ========================================================================== */
function parseWhatsAppBudget(rawText) {
  const lines = String(rawText || "")
    .split(/\r?\n/)
    .map((l) => l.trim())
    .filter(Boolean);

  let vehiculo = "";
  let dominio = "";
  let area = "";
  let ordenCompra = "";
  let ejercicio = "2026";
  let totalAmount = 0;
  const items = [];

  for (let line of lines) {
    // Check Orden de Compra
    const mOc = line.match(/(?:orden\s+de\s+compra|o\.?\s*c\.?)\s*(?:número|numero|nro|n°|nº|n\.?)?\s*[:.\s]*([a-zA-Z0-9\-\/]+)(?:[,\s]*(?:ejercicio|ej\.|año)\s*(\d{4}))?/i);
    if (mOc) {
      ordenCompra = mOc[1].trim().toUpperCase();
      if (mOc[2]) ejercicio = mOc[2].trim();
      continue;
    }

    // Dominio / Patente
    const mDom = line.match(/(?:dominio|patente)\.?\s*:?\s*([a-zA-Z0-9\s\-]+)/i);
    if (mDom) {
      dominio = mDom[1].trim().toUpperCase();
      continue;
    }

    // Area
    const mArea = line.match(/(?:area|área)\.?\s*:?\s*(.+)/i);
    if (mArea) {
      area = mArea[1].trim().toUpperCase();
      continue;
    }

    // Total / Mano de obra
    const mTot = line.match(/(?:valor\s+mano\s+de\s+obra|mano\s+de\s+obra|total|valor|importe)\s*:?\s*\$?\s*([0-9.,]+)/i);
    if (mTot) {
      const numStr = mTot[1].replace(/\./g, "").replace(",", ".");
      totalAmount = parseFloat(numStr) || 0;
      continue;
    }

    // Standalone price like '$1.500.000'
    const mPrice = line.match(/^\$\s*([0-9.,]+)$/);
    if (mPrice) {
      const numStr = mPrice[1].replace(/\./g, "").replace(",", ".");
      totalAmount = parseFloat(numStr) || 0;
      continue;
    }

    // Vehicle
    if (!vehiculo && /^(fiat|ford|chevrolet|toyota|peugeot|renault|volkswagen|vw|honda|nissan|citroen|jeep|audi|bmw|mercedes|hyundai|kia|moto|camion|scania|iveco)/i.test(line)) {
      vehiculo = line.trim().toUpperCase();
      continue;
    }

    // Line with price
    const mLineP = line.match(/^(.+?)\s*[-:]?\s*\$\s*([0-9.,]+)$/);
    if (mLineP) {
      const desc = mLineP[1].replace(/^[•\-\*0-9.)]+\s*/, "").replace(/[.-]+$/, "").trim().toUpperCase();
      const p = parseFloat(mLineP[2].replace(/\./g, "").replace(",", ".")) || 0;
      if (desc) items.push({ descripcion: desc, cantidad: 1, unidad: "un", precio: p });
      continue;
    }

    // Regular task line
    let cleanDesc = line.replace(/^[•\-\*0-9.)]+\s*/, "").replace(/[.-]+$/, "").trim().toUpperCase();
    if (cleanDesc) {
      items.push({ descripcion: cleanDesc, cantidad: 1, unidad: "un", precio: 0 });
    }
  }

  return { vehiculo, dominio, area, ordenCompra, ejercicio, totalAmount, items };
}

function modalWhatsAppImport(onImport) {
  openModal(
    `<h3>📋 Carga rápida desde WhatsApp</h3>
    <p class="tiny" style="margin-bottom:10px">Pegá el mensaje de WhatsApp. Se extraerán el vehículo, patente, cada renglón en MAYÚSCULAS y el valor total.</p>
    <div class="field">
      <label>Pegar texto del mensaje</label>
      <textarea id="watext" rows="8" placeholder="Ej:
Fiat estrada 1.4
Dominio. AE136BM
AREA dirección de articulaciones
Reparación de los 4 frenos .
Remplazo de kit de embrague.
Valor mano de obra $1.500.000" style="width:100%;font-size:13px;border-radius:10px;min-height:140px"></textarea>
    </div>

    <div class="field" style="margin-top:10px">
      <label>Distribución del importe</label>
      <select id="wamode">
        <option value="global">Renglón final de Mano de Obra con el Total</option>
        <option value="dividido">Dividir el importe en partes iguales en cada renglón</option>
        <option value="primero">Poner el total en el primer renglón</option>
        <option value="cero">Dejar renglones con precio individual a completar</option>
      </select>
    </div>

    <div class="actions" style="margin-top:14px">
      <button class="btn btn-ok" id="btn-do-wa-import" style="background:#1b7a4c;color:#fff;font-weight:800">⚡ Procesar e Importar Renglones</button>
      <button class="btn btn-ghost" type="button" onclick="closeModal()">Cancelar</button>
    </div>`,
    (root) => {
      $("#btn-do-wa-import", root).onclick = () => {
        const raw = $("#watext", root).value.trim();
        if (!raw) {
          toast("Pegá algún texto primero.");
          return;
        }
        const parsed = parseWhatsAppBudget(raw);
        if (!parsed.items.length) {
          toast("No se detectaron renglones válidos.");
          return;
        }

        const mode = $("#wamode", root).value;
        const total = parsed.totalAmount;
        const count = parsed.items.length;

        if (total > 0) {
          if (mode === "global") {
            parsed.items.push({
              descripcion: "VALOR MANO DE OBRA / TRABAJOS GENERALES",
              cantidad: 1,
              unidad: "glb",
              precio: total,
            });
          } else if (mode === "dividido" && count > 0) {
            const unitPrice = Math.round((total / count) * 100) / 100;
            parsed.items.forEach((it) => (it.precio = unitPrice));
          } else if (mode === "primero" && count > 0) {
            parsed.items[0].precio = total;
          }
        }

        const metaParts = [];
        if (parsed.vehiculo) metaParts.push("VEHÍCULO: " + parsed.vehiculo);
        if (parsed.dominio) metaParts.push("DOMINIO / PATENTE: " + parsed.dominio);
        if (parsed.area) metaParts.push("ÁREA: " + parsed.area);
        const notes = metaParts.join(" · ");

        closeModal();
        toast(`¡${parsed.items.length} renglones importados en mayúsculas!`);
        onImport(parsed.items, notes);
      };
    }
  );
}

    `*PRESUPUESTO ${q.numero}*`,
    `*${s?.nombreFantasia || s?.razonSocial || "Taller"}*`,
    "",
    `*Cliente:* ${q.clientSnapshot?.nombre || "Estimado cliente"}`,
  ];

  if (q.observaciones) {
    lines.push(`*Detalle:* ${q.observaciones}`);
  }

  lines.push("", "*Trabajos / Conceptos a realizar:*", itemsText, "");
  lines.push(`*Total:* ${money(t.total)}`);
  lines.push(`*Forma de pago:* ${PAGO_OPTS.find((p) => p.id === q.pagoTipo)?.t || q.pagoTipo}`);
  if (q.validezHasta) {
    lines.push(`*Válido hasta:* ${dAR(q.validezHasta)}`);
  }
  lines.push("", "Quedamos a tu disposición. ¡Muchas gracias!");
  return lines.join("\n");
}

      model.descuentoTipo = f.descuentoTipo.value;
      model.descuentoValor = Number(f.descuentoValor.value || 0);
      model.ivaPct = Number(f.ivaPct.value || 0);
      model.anticipo = Number(f.anticipo.value || 0);
      model.observaciones = f.observaciones.value;
      model.condiciones = f.condiciones.value;

        descripcion: $("[name=desc]", el).value,
        cantidad: Number($("[name=cant]", el).value || 0),
        unidad: $("[name=un]", el).value,
        precio: Number(String($("[name=pre]", el).value).replace(",", ".")),
      }));

      read();
      paint();

    $$(".pay-opt", v).forEach((el) =>

        read();
        model.pagoTipo = el.dataset.p;
        paint();
      })
    );
    $("#additem").onclick = () => {
      read();
      model.items.push({ descripcion: "", cantidad: 1, unidad: "un", precio: 0 });
      paint();
    };
    const openWaImport = () => {
      modalWhatsAppImport((newItems, notes) => {
        read();
        model.items = newItems;
        if (notes) {
          model.observaciones = model.observaciones ? model.observaciones + "\n" + notes : notes;
        }
        paint();
      });
    };
    if ($("#btn-quick-wa", v)) $("#btn-quick-wa", v).onclick = openWaImport;
    if ($("#btn-wa-items", v)) $("#btn-wa-items", v).onclick = openWaImport;
    $$(".btn-del", v).forEach((b) => {
      b.onclick = () => {
        read();
        const i = Number(b.closest(".item-line").dataset.idx);
        model.items.splice(i, 1);
        if (!model.items.length) model.items.push({ descripcion: "", cantidad: 1, unidad: "un", precio: 0 });
        paint();
      };
    });
    $("#fromcat").onchange = (e) => {
      const it = catalog.find((c) => c.id === e.target.value);
      if (!it) return;
      read();
      model.items.push({ descripcion: it.descripcion, cantidad: 1, unidad: it.unidad, precio: it.precio });
      paint();
    };
    ["descuentoValor", "ivaPct", "anticipo", "descuentoTipo"].forEach((n) => {
      const el = $(`[name=${n}]`, v);
      el?.addEventListener("change", refresh);
    });
    $("#addcli").onclick = () => quickClient(async (c) => {
      clients.push(c);
      model.clientId = c.id;
      paint();
    });
    const save = async (aceptar) => {
      read();
      try {
        const body = { ...model, status: aceptar ? "aceptado" : existing?.status || "borrador" };
        const saved = editing
          ? await api("/api/quotes/" + existing.id, { method: "PUT", body })
          : await api("/api/quotes", { method: "POST", body });
        if (aceptar && saved.status !== "aceptado") {
          await api(`/api/quotes/${saved.id}/status`, { method: "PATCH", body: { status: "aceptado" } });
        }
        toast(aceptar ? "Aceptado. Ya genera cuotas." : "Presupuesto guardado");
        go("ver", { id: saved.id });
      } catch (err) {
        toast(err.message);
      }
    };
    $("#qf").onsubmit = (e) => {
      e.preventDefault();
      save(false);
    };
    $("#saveacc").onclick = () => save(true);
  };
  paint();
}

async function modalFacturarArca(q) {
  try {
    const s = state.settings || (await api("/api/settings")) || {};
    const cli = q.clientSnapshot || {};
    const tipo = (function () {
      const e = String(s.condicionIva || "Monotributo").toLowerCase();
      const c = String(cli.condicionIva || "Consumidor Final").toLowerCase();
      if (e.includes("monotributo") || e.includes("exento")) return { letra: "C", cod: "011", nombre: "Factura C" };
      if (e.includes("inscripto") || e.includes("responsable")) {
        if (c.includes("inscripto") || c.includes("responsable")) return { letra: "A", cod: "001", nombre: "Factura A" };
        return { letra: "B", cod: "006", nombre: "Factura B" };
      }
      return { letra: "C", cod: "011", nombre: "Factura C" };
    })();

    const pv = s.puntoVentaArca || "00002";
    const keyNro = tipo.letra === "A" ? "proximaFacturaA" : tipo.letra === "B" ? "proximaFacturaB" : "proximaFacturaC";
    let proximo = Number(s[keyNro] || 1);
    let arcaOnline = false;
    const arcaServerUrl = s.arcaServerUrl || "http://localhost:3000";
    const modoArca = s.arcaModo || "oficial";

    const baseUrl = getArcaBaseUrl(s);
    // Si está configurado modo oficial o homologación, consultar último número en tiempo real
    if (modoArca !== "offline") {
      try {
        const ctrl = new AbortController();
        const timeoutId = setTimeout(() => ctrl.abort(), 2000);
        const ures = await fetch(`${baseUrl}/api/arca/ultimo?pv=${Number(pv)}&tipo=${Number(tipo.cod)}`, { signal: ctrl.signal });
        clearTimeout(timeoutId);
        if (ures.ok) {
          const ujson = await ures.json();
          if (ujson && ujson.proximoNumero) {
            proximo = ujson.proximoNumero;
            arcaOnline = true;
          }
        }
      } catch (_) {
        arcaOnline = false;
      }
    }

    const totals = q.totals || totalsLocal(q) || { total: 0 };
    const days = (function () {
      const t = q.pagoTipo || "30-60-90";
      if (t === "contado") return [0];
      if (t === "30") return [30];
      if (t === "60") return [60];
      if (t === "90") return [90];
      if (t === "30-60") return [30, 60];
      return [30, 60, 90];
    })();
    const anticipo = Math.min(Number(q.anticipo || 0), totals.total || 0);
    const resto = Math.max(0, (totals.total || 0) - anticipo);
    const cuotaVal = days.length ? Math.round((resto / days.length) * 100) / 100 : 0;
    const fechaHoy = todayISO();

    const statusBadge = arcaOnline
      ? `<span class="pill" style="background:#1b7a4c;color:#fff;font-weight:800">🟢 ARCA Oficial Conectado (${modoArca.toUpperCase()})</span>`
      : modoArca !== "offline"
      ? `<span class="pill" style="background:#b45309;color:#fff;font-weight:800">🟡 Modo Autónomo / Conector local ${arcaServerUrl ? "desconectado" : ""}</span>`
      : `<span class="pill" style="background:#555;color:#fff;font-weight:800">⚪ Modo Autónomo / Offline</span>`;

    openModal(
      `<h3>⚡ Pasar a Factura Electrónica ARCA</h3>
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:6px">
        <span class="tiny">Comprobante fiscal con CAE y QR oficial.</span>
        ${statusBadge}
      </div>
      
      <div class="card" style="background:#fbf8f2;margin-bottom:14px;border:1.5px solid #c4a35a">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
          <span style="font-size:11px;font-weight:800;text-transform:uppercase;color:var(--muted)">Tipo Comprobante</span>
          <span class="pill" style="background:#0e2a22;color:#fff;font-weight:800;font-size:13px">${tipo.nombre} (COD. ${tipo.cod})</span>
        </div>
        <div class="line" style="display:flex;justify-content:space-between;font-size:12px;margin:4px 0">
          <span>Punto de Venta / Nro:</span>
          <b>${String(pv).padStart(5, "0")}-${String(proximo).padStart(8, "0")}</b>
        </div>
        <div class="line" style="display:flex;justify-content:space-between;font-size:12px;margin:4px 0">
          <span>Emisor (${esc(s.condicionIva || "Monotributo")}):</span>
          <b>${esc(s.razonSocial || "Tu Comercio")}</b>
        </div>
        <div class="line" style="display:flex;justify-content:space-between;font-size:12px;margin:4px 0">
          <span>Cliente / Receptor:</span>
          <b>${esc(cli.nombre || "Consumidor Final")} (${esc(cli.condicionIva || "Consumidor Final")})</b>
        </div>
        <div class="line" style="display:flex;justify-content:space-between;font-size:12px;margin:4px 0">
          <span>Documento:</span>
          <b>${esc(cli.docTipo || "Doc")}: ${esc(cuitFmt(cli.docNro) || cli.docNro || "—")}</b>
        </div>

async function makePdfBlob() {
  const el = $("#pdfdoc");
  if (!el) throw new Error("Documento no encontrado");

  // Forzar captura en formato A4 estándar (794px = 210mm a 96DPI)
  const canvas = await html2canvas(el, {
    scale: 2,
    useCORS: true,
    backgroundColor: "#ffffff",
    windowWidth: 1024,
    onclone: (clonedDoc) => {
      const clonedEl = clonedDoc.getElementById("pdfdoc");
      if (clonedEl) {
        clonedEl.style.width = "794px";
        clonedEl.style.minWidth = "794px";
        clonedEl.style.maxWidth = "794px";
        clonedEl.style.boxSizing = "border-box";
        clonedEl.style.margin = "0 auto";
        clonedEl.style.padding = "24px 28px";
        clonedEl.style.fontSize = "11.5px";
        clonedEl.style.transform = "none";

        const topEl = clonedEl.querySelector(".pdf-top");
        if (topEl) topEl.style.gridTemplateColumns = "1fr 200px";

        const arcaTop = clonedEl.querySelector(".pdf-arca-top");
        if (arcaTop) arcaTop.style.gridTemplateColumns = "1.15fr 74px 1.15fr";

        const clientEl = clonedEl.querySelector(".pdf-client");
        if (clientEl) clientEl.style.gridTemplateColumns = "1fr 1fr";

        const footEl = clonedEl.querySelector(".pdf-foot");
        if (footEl) footEl.style.gridTemplateColumns = "1fr 1fr";

        const signEl = clonedEl.querySelector(".pdf-sign");
        if (signEl) signEl.style.gridTemplateColumns = "1fr 1fr";
      }
    },
  });

  const img = canvas.toDataURL("image/jpeg", 0.96);
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF("p", "mm", "a4");
  const pageW = 210;
  const pageH = 297;
  const imgH = (canvas.height * pageW) / canvas.width;

  // Si entra en una página A4, la ajustamos perfecta a 1 hoja
  if (imgH <= pageH + 8) {
    pdf.addImage(img, "JPEG", 0, 0, pageW, Math.min(imgH, pageH));
  } else {
    let hLeft = imgH;
    let pos = 0;
    pdf.addImage(img, "JPEG", 0, pos, pageW, imgH);
    hLeft -= pageH;
    while (hLeft > 5) {
      pos = hLeft - imgH;
      pdf.addPage();
      pdf.addImage(img, "JPEG", 0, pos, pageW, imgH);
      hLeft -= pageH;
    }
  }
  return pdf.output("blob");
}

async function downloadPdf(numero) {
  try {
    toast("Generando PDF…");
    const blob = await makePdfBlob();
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `Presupuesto_${numero}.pdf`;
    a.click();
    toast("PDF descargado");
  } catch (e) {
    toast("No se pudo armar el PDF. Probá Imprimir → Guardar como PDF.");
  }
}

async function sharePdf(q) {
  try {
    const blob = await makePdfBlob();
    const file = new File([blob], `Presupuesto_${q.numero}.pdf`, { type: "application/pdf" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: "Presupuesto " + q.numero, text: q.clientSnapshot?.nombre });
      return;
    }
    await downloadPdf(q.numero);
    const wa = (q.clientSnapshot?.whatsapp || "").replace(/\D/g, "");
    if (wa) window.open(`https://wa.me/${wa}?text=${encodeURIComponent("Te adjunto el presupuesto " + q.numero + " por " + money(q.totals.total) + ".")}`, "_blank");
  } catch (e) {
    if (e.name !== "AbortError") toast("Usá Descargar PDF y adjuntarlo al chat.");
  }
}

function renderClients(list) {
  if (!list.length) return `<div class="empty">Sin clientes.</div>`;
  return list
    .map(
      (c) => `<div class="row" data-id="${c.id}">
      <div class="meta"><div class="title">${esc(c.nombre)}</div>
      <div class="sub">${esc(c.condicionIva || "s/cond.")} · ${esc(c.docTipo)} ${esc(c.docNro || "—")} · ${esc(c.localidad || "")}</div></div>
    </div>`
    )
    .join("");
}

function bindClientRows(list) {
  $$(".row[data-id]").forEach((r) => {
    r.onclick = () => {
      const c = list.find((x) => x.id === r.dataset.id);
      openModal(
        `<h3>${esc(c.nombre)}</h3>
        <form class="form" id="ef">
          <div class="field"><label>Nombre</label><input name="nombre" value="${esc(c.nombre)}" /></div>
          <div class="two">
            <div class="field"><label>Tipo doc.</label><select name="docTipo">
              ${["DNI", "CUIT", "CUIL"].map((t) => `<option ${c.docTipo === t ? "selected" : ""}>${t}</option>`).join("")}
            </select></div>
            <div class="field"><label>Número</label><input name="docNro" value="${esc(c.docNro)}" /></div>
          </div>
          <div class="field iva-box"><label>Condición impositiva del cliente</label>
            ${ivaSelect(c.condicionIva || "Consumidor Final")}
          </div>
          <div class="field"><label>Domicilio</label><input name="domicilio" value="${esc(c.domicilio)}" /></div>
          <div class="field"><label>Localidad</label><input name="localidad" value="${esc(c.localidad)}" /></div>
          <div class="field"><label>Teléfono</label><input name="telefono" value="${esc(c.telefono)}" /></div>
          <div class="field"><label>WhatsApp</label><input name="whatsapp" value="${esc(c.whatsapp)}" /></div>
          <div class="field"><label>Email</label><input name="email" value="${esc(c.email)}" /></div>
          <div class="field"><label>Notas</label><textarea name="notas">${esc(c.notas)}</textarea></div>
          <div class="actions">
            <button class="btn btn-primary" type="submit">Guardar</button>
            <button class="btn btn-danger" type="button" id="dc">Eliminar</button>
          </div>
        </form>`,
        (root) => {
          $("#ef", root).onsubmit = async (e) => {
            e.preventDefault();
            const body = Object.fromEntries(new FormData(e.target).entries());
            await api("/api/clients/" + c.id, { method: "PUT", body });
            closeModal();
            toast("Cliente actualizado");
            render();
          };
          $("#dc", root).onclick = async () => {
            if (!confirm("¿Eliminar cliente?")) return;
            await api("/api/clients/" + c.id, { method: "DELETE" });
            closeModal();
            render();
          };
        }
      );
    };
  });
}

    `<h3>${it ? "Editar ítem" : "Nuevo ítem"}</h3>

      <div class="field"><label>Descripción</label><input name="descripcion" data-upper="true" autocapitalize="characters" required value="${esc(it?.descripcion || "")}" /></div>

      <div class="actions">
        <button class="btn btn-primary" type="submit">Guardar</button>
        ${it ? `<button class="btn btn-danger" type="button" id="dk">Eliminar</button>` : ""}
      </div>

    (root) => {
      $("#kf", root).onsubmit = async (e) => {
        e.preventDefault();
        const body = Object.fromEntries(new FormData(e.target).entries());
        body.precio = Number(body.precio || 0);
        if (it) await api("/api/catalog/" + it.id, { method: "PUT", body });
        else await api("/api/catalog", { method: "POST", body });
        closeModal();
        render();
      };
      $("#dk", root)?.addEventListener("click", async () => {
        await api("/api/catalog/" + it.id, { method: "DELETE" });
        closeModal();
        render();
      });
    }
  );
}

function getArcaBaseUrl(s) {
  if (location.protocol === "http:" || location.protocol === "https:") {
    if (!s || !s.arcaServerUrl || s.arcaServerUrl === "http://localhost:3000" || s.arcaServerUrl === "/") {
      return "";
    }
  }
  return String((s && s.arcaServerUrl) || "http://localhost:3000").replace(/\/+$/, "");
}
window.getArcaBaseUrl = getArcaBaseUrl;

    // Enviar configuración al servidor ARCA si hay datos de certificado/clave

async function viewRemitos(v) {
  const q = state.params.q || "";
  const status = state.params.status || "todos";
  const list = await api(`/api/remitos?q=${encodeURIComponent(q)}&status=${encodeURIComponent(status)}`);
  const chips = ["todos", "borrador", "emitido", "entregado", "anulado"];
  v.innerHTML = `
    <h2 class="page-title">Remitos</h2>
    <p class="lede">${list.length} comprobantes de entrega. Impresión A4, con condición IVA del cliente.</p>
    <input class="search" id="rsearch" placeholder="Buscar cliente o número…" value="${esc(q)}" />
    <div class="filters">
      ${chips.map((c) => `<button class="chip ${status === c ? "on" : ""}" data-st="${c}">${c === "todos" ? "Todos" : STATUS_LBL[c]}</button>`).join("")}
    </div>
    ${
      list.length
        ? `<div class="list">${list
            .map(
              (x) => `<div class="row" onclick="go('remito-ver',{id:'${x.id}'})">
          <div class="meta"><div class="title">${esc(x.clientSnapshot?.nombre)}</div>
          <div class="sub">${esc(x.numero)} · ${dAR(x.fecha)} · ${esc(x.clientSnapshot?.condicionIva || "")}</div></div>
          <span class="pill ${x.status}">${STATUS_LBL[x.status] || x.status}</span></div>`
            )
            .join("")}</div>`
        : `<div class="empty">Todavía no hay remitos.</div>`
    }
    <button class="fab" onclick="go('remito-nuevo')">＋ Nuevo remito</button>
  `;
  $("#rsearch").addEventListener("change", (e) => {
    state.params.q = e.target.value;
    viewRemitos(v);
  });
  $$(".chip", v).forEach((c) =>
    c.addEventListener("click", () => {
      state.params.status = c.dataset.st;
      viewRemitos(v);
    })
  );
}

async function viewRemitoEditor(v) {
  const editing = state.route === "remito-editar" && state.params.id;
  const [clients, catalog, existing, quotes] = await Promise.all([
    api("/api/clients"),
    api("/api/catalog"),
    editing ? api("/api/remitos/" + state.params.id) : Promise.resolve(null),
    api("/api/quotes").catch(() => []),
  ]);
  const s = state.settings || {};
  const model = existing
    ? {
        clientId: existing.clientId,
        fecha: existing.fecha,
        items: existing.items.length ? existing.items : [{ descripcion: "", cantidad: 1, unidad: "un", codigo: "" }],
        origen: existing.origen || "",
        destino: existing.destino || "",
        transporte: existing.transporte || "",
        patente: existing.patente || "",
        chofer: existing.chofer || "",
        observaciones: existing.observaciones || "",
        presupuestoId: existing.presupuestoId || "",
      }
    : {
        clientId: clients[0]?.id || "",
        fecha: todayISO(),
        items: [{ descripcion: "", cantidad: 1, unidad: "un", codigo: "" }],
        origen: s.domicilio || "",
        destino: clients[0]?.domicilio || "",
        transporte: "",
        patente: "",
        chofer: "",
        observaciones: "",
        presupuestoId: "",
      };

  const paint = () => {
    const cli = clients.find((c) => c.id === model.clientId);
    v.innerHTML = `
      <h2 class="page-title">${editing ? "Editar remito" : "Nuevo remito"}</h2>
      <p class="lede">${editing ? existing.numero : "Se numera al guardar"} · A4 · no es factura</p>
      <form class="form" id="rf">
        <div class="field"><label>Cliente</label>
          <select name="clientId">${
            clients.length
              ? clients
                  .map(
                    (c) =>
                      `<option value="${c.id}" ${c.id === model.clientId ? "selected" : ""}>${esc(c.nombre)} — ${esc(c.condicionIva || "s/cond. IVA")}</option>`
                  )
                  .join("")
              : `<option value="">Primero cargá un cliente</option>`
          }</select>
          <button type="button" class="btn btn-sm btn-ghost" style="margin-top:8px" id="addcli">＋ Cliente nuevo</button>
        </div>
        ${
          cli
            ? `<div class="card iva-box"><b>Condición impositiva:</b> ${esc(cli.condicionIva || "no cargada")}<div class="tiny">${esc(cli.docTipo)} ${esc(cli.docNro || "—")}</div></div>`
            : ""
        }
        <div class="two">
          <div class="field"><label>Fecha</label><input type="date" name="fecha" value="${model.fecha}" /></div>
          <div class="field"><label>Presupuesto asociado</label>
            <select name="presupuestoId">
              <option value="">Ninguno</option>
              ${(quotes || []).map((q) => `<option value="${q.id}" ${model.presupuestoId === q.id ? "selected" : ""}>${esc(q.numero)} · ${esc(q.clientSnapshot?.nombre)}</option>`).join("")}
            </select>
          </div>
        </div>
        <div class="field"><label>Origen / depósito</label><input name="origen" value="${esc(model.origen)}" /></div>
        <div class="field"><label>Destino / entrega</label><input name="destino" value="${esc(model.destino)}" /></div>
        <div class="two">
          <div class="field"><label>Transporte</label><input name="transporte" value="${esc(model.transporte)}" /></div>
          <div class="field"><label>Patente</label><input name="patente" value="${esc(model.patente)}" /></div>
        </div>
        <div class="field"><label>Chofer</label><input name="chofer" value="${esc(model.chofer)}" /></div>
        <div class="card">
          <div class="item-head"><b>Mercadería</b>
            <select id="fromcat" style="height:34px;border-radius:10px;border:1px solid var(--line)">
              <option value="">Del catálogo…</option>
              ${catalog.map((c) => `<option value="${c.id}">${esc(c.descripcion)}</option>`).join("")}
            </select>
          </div>
          <div id="items">${model.items.map(remitoItemRow).join("")}</div>
          <button type="button" class="btn btn-soft btn-sm" id="additem">＋ Renglón</button>
        </div>
        <div class="field"><label>Observaciones</label><textarea name="observaciones">${esc(model.observaciones)}</textarea></div>
        <div class="actions">
          <button class="btn btn-primary grow" type="submit">Guardar remito</button>
          <button class="btn btn-soft" type="button" id="saveem">Guardar y emitir</button>
        </div>
      </form>
    `;
    const read = () => {
      const f = $("#rf");
      model.clientId = f.clientId.value;
      model.fecha = f.fecha.value;
      model.presupuestoId = f.presupuestoId.value;
      model.origen = f.origen.value;
      model.destino = f.destino.value;
      model.transporte = f.transporte.value;
      model.patente = f.patente.value;
      model.chofer = f.chofer.value;
      model.observaciones = f.observaciones.value;
      model.items = $$(".item-line", f).map((el) => ({
        descripcion: $("[name=desc]", el).value,
        codigo: $("[name=cod]", el).value,
        cantidad: Number($("[name=cant]", el).value || 0),
        unidad: $("[name=un]", el).value,
      }));
    };
    $("[name=clientId]", v).onchange = () => {
      read();
      const c = clients.find((x) => x.id === model.clientId);
      if (c && !model.destino) model.destino = c.domicilio || "";
      paint();
    };
    $("#additem").onclick = () => {
      read();
      model.items.push({ descripcion: "", cantidad: 1, unidad: "un", codigo: "" });
      paint();
    };
    $$(".btn-del-r", v).forEach((b) => {
      b.onclick = () => {
        read();
        model.items.splice(Number(b.closest(".item-line").dataset.idx), 1);
        if (!model.items.length) model.items.push({ descripcion: "", cantidad: 1, unidad: "un", codigo: "" });
        paint();
      };
    });
    $("#fromcat").onchange = (e) => {
      const it = catalog.find((c) => c.id === e.target.value);
      if (!it) return;
      read();
      model.items.push({ descripcion: it.descripcion, cantidad: 1, unidad: it.unidad, codigo: it.codigo || "" });
      paint();
    };
    $("#addcli").onclick = () =>
      quickClient((c) => {
        clients.push(c);
        model.clientId = c.id;
        model.destino = c.domicilio || model.destino;
        paint();
      });
    const save = async (emitir) => {
      read();
      const q = (quotes || []).find((x) => x.id === model.presupuestoId);
      const body = { ...model, presupuestoNumero: q ? q.numero : "", status: emitir ? "emitido" : existing?.status || "borrador" };
      try {
        const saved = editing
          ? await api("/api/remitos/" + existing.id, { method: "PUT", body })
          : await api("/api/remitos", { method: "POST", body });
        if (emitir && saved.status !== "emitido") {
          await api(`/api/remitos/${saved.id}/status`, { method: "PATCH", body: { status: "emitido" } });
        }

function openModal(html, bind) {
  const root = $("#modal-root");

  bind && bind(root);
}
