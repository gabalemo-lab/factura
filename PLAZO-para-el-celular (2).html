async function modalFacturarArca(q) {
  try {
    const s = state.settings || (await api("/api/settings")) || {};
    const cli = q.clientSnapshot || {};
    const tipo = (function () {
      const e = String(s.condicionIva || "Monotributo").toLowerCase();
      const c = String(cli.condicionIva || "Consumidor Final").toLowerCase();
      if (e.includes("monotributo") || e.includes("exento")) return { letra: "C", cod: "011", nombre: "Factura C" };
      if (e.includes("inscripto") || e.includes("responsable")) {
        if (c.includes("inscripto") || c.includes("responsable")) return { letra: "A", cod: "001", nombre: "Factura A" };
        return { letra: "B", cod: "006", nombre: "Factura B" };
      }
      return { letra: "C", cod: "011", nombre: "Factura C" };
    })();

    const pv = s.puntoVentaArca || "00002";
    const keyNro = tipo.letra === "A" ? "proximaFacturaA" : tipo.letra === "B" ? "proximaFacturaB" : "proximaFacturaC";
    let proximo = Number(s[keyNro] || 1);
    let arcaOnline = false;
    const arcaServerUrl = s.arcaServerUrl || "http://localhost:3000";
    const modoArca = s.arcaModo || "oficial";

    const baseUrl = getArcaBaseUrl(s);
    // Si está configurado modo oficial o homologación, consultar último número en tiempo real
    if (modoArca !== "offline") {
      try {
        const ctrl = new AbortController();
        const timeoutId = setTimeout(() => ctrl.abort(), 2000);
        const ures = await fetch(`${baseUrl}/api/arca/ultimo?pv=${Number(pv)}&tipo=${Number(tipo.cod)}`, { signal: ctrl.signal });
        clearTimeout(timeoutId);
        if (ures.ok) {
          const ujson = await ures.json();
          if (ujson && ujson.proximoNumero) {
            proximo = ujson.proximoNumero;
            arcaOnline = true;
          }
        }
      } catch (_) {
        arcaOnline = false;
      }
    }

    const totals = q.totals || totalsLocal(q) || { total: 0 };
    const days = (function () {
      const t = q.pagoTipo || "30-60-90";
      if (t === "contado") return [0];
      if (t === "30") return [30];
      if (t === "60") return [60];
      if (t === "90") return [90];
      if (t === "30-60") return [30, 60];
      return [30, 60, 90];
    })();
    const anticipo = Math.min(Number(q.anticipo || 0), totals.total || 0);
    const resto = Math.max(0, (totals.total || 0) - anticipo);
    const cuotaVal = days.length ? Math.round((resto / days.length) * 100) / 100 : 0;
    const fechaHoy = todayISO();
    const defaultVtoPago = days.length && days[0] > 0 ? addDays(fechaHoy, days[0]) : (days.length > 1 && days[1] > 0 ? addDays(fechaHoy, days[1]) : fechaHoy);

    const statusBadge = arcaOnline
      ? `<span class="pill" style="background:#1b7a4c;color:#fff;font-weight:800">🟢 ARCA Oficial Conectado (${modoArca.toUpperCase()})</span>`
      : modoArca !== "offline"
      ? `<span class="pill" style="background:#b45309;color:#fff;font-weight:800">🟡 Modo Autónomo / Conector local ${arcaServerUrl ? "desconectado" : ""}</span>`
      : `<span class="pill" style="background:#555;color:#fff;font-weight:800">⚪ Modo Autónomo / Offline</span>`;

    openModal(
      `<h3>⚡ Pasar a Factura Electrónica ARCA</h3>
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:6px">

        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">

        </div>
        <div class="line" style="display:flex;justify-content:space-between;font-size:12px;margin:4px 0">
          <span>Emisor (${esc(s.condicionIva || "Monotributo")}):</span>

        </div>

          <span>Importe Total:</span>
          <b style="color:#0e2a22">${money(totals.total)}</b>
        </div>

        <!-- Sección Orden de Compra -->
        <div style="margin-top:12px;padding-top:10px;border-top:1px solid #d8d1c4">
          <div style="font-size:11px;font-weight:800;text-transform:uppercase;color:#0e2a22;margin-bottom:6px">

        <!-- Sección Fechas Fiscales y Período ARCA -->

            📅 Plan de Cuotas (${days.map((d) => (d === 0 ? "Contado" : d + " días")).join(" / ")} desde emisión):
          </div>
          <div id="fac-cuotas-grid" style="display:grid;grid-template-columns:repeat(${days.length}, 1fr);gap:6px">
            ${days
              .map(
                (d, i) => `<div style="background:#fff;border:1px solid #d8d1c4;border-radius:6px;padding:5px 6px;text-align:center">
              <div style="font-size:9.5px;color:#666">${d === 0 ? "Contado" : "Cuota " + (i + 1) + " (" + d + " d)"}</div>
              <div style="font-size:11px;font-weight:800;color:#0e2a22">${money(cuotaVal)}</div>

              )
              .join("")}
          </div>
        </div>
      </div>
      
      <div class="actions">
        <button class="btn btn-ok" id="btn-confirm-arca" style="background:#1b7a4c;color:#fff;font-weight:800">⚡ Confirmar y Emitir Factura ARCA</button>
        <button class="btn btn-ghost" type="button" onclick="closeModal()">Cancelar</button>
      </div>`,
      (root) => {
        const facFechaEl = $("#fac-fecha", root);
        const facVtoEl = $("#fac-vto-pago", root);
        const facDesdeEl = $("#fac-per-desde", root);
        const facHastaEl = $("#fac-per-hasta", root);
        const cuotasGrid = $("#fac-cuotas-grid", root);

        function updateCuotasDisplay(baseFch) {
          if (!cuotasGrid) return;
          cuotasGrid.innerHTML = days
            .map(
              (d, i) => `<div style="background:#fff;border:1px solid #d8d1c4;border-radius:6px;padding:5px 6px;text-align:center">
            <div style="font-size:9.5px;color:#666">${d === 0 ? "Contado" : "Cuota " + (i + 1) + " (" + d + " d)"}</div>
            <div style="font-size:11px;font-weight:800;color:#0e2a22">${money(cuotaVal)}</div>
            <div style="font-size:9.5px;font-weight:700;color:#1b7a4c">Vto: ${dAR(addDays(baseFch, d))}</div>
          </div>`
            )
            .join("");
        }

        if (facFechaEl) {
          facFechaEl.onchange = (e) => {
            const f = e.target.value || todayISO();
            const newVto = days.length && days[0] > 0 ? addDays(f, days[0]) : (days.length > 1 && days[1] > 0 ? addDays(f, days[1]) : f);
            if (facVtoEl) facVtoEl.value = newVto;
            if (facDesdeEl && facDesdeEl.value === fechaHoy) facDesdeEl.value = f;
            if (facHastaEl && facHastaEl.value === fechaHoy) facHastaEl.value = f;
            updateCuotasDisplay(f);
          };
        }

        $("#btn-confirm-arca", root).onclick = async () => {
          try {
            const oc = $("#oc-num", root)?.value.trim() || "";
            const ej = $("#oc-ej", root)?.value.trim() || "2026";
            const chk = $("#oc-chk", root)?.checked ?? true;
            const chosenFecha = facFechaEl?.value || todayISO();
            const chosenVtoPago = facVtoEl?.value || defaultVtoPago;
            const chosenPerDesde = facDesdeEl?.value || chosenFecha;
            const chosenPerHasta = facHastaEl?.value || chosenFecha;

            $("#btn-confirm-arca", root).disabled = true;
            $("#btn-confirm-arca", root).textContent = "Consultando ARCA / AFIP…";

            let caeOfficial = "";
            let caeVtoOfficial = "";
            let nroOfficial = null;
            let pvOfficial = pv;

            if (arcaOnline || (modoArca !== "offline" && arcaServerUrl)) {
              try {
                const docTipoNum = (function () {
                  const dt = String(cli.docTipo || "").toUpperCase();
                  if (dt === "CUIT") return 80;
                  if (dt === "CUIL") return 86;
                  if (dt === "DNI") return 96;
                  return 99;
                })();

                const emitRes = await fetch(`${baseUrl}/api/arca/emitir`, {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({
                    ptoVta: Number(pv),
                    cbteTipo: Number(tipo.cod),
                    docTipo: docTipoNum,
                    docNro: cli.docNro || 0,
                    impTotal: totals.total,
                    impNeto: tipo.letra === "A" ? totals.base : totals.total,
                    impIva: tipo.letra === "A" ? totals.iva : 0,
                    fecha: chosenFecha,
                    periodoDesde: chosenPerDesde,
                    periodoHasta: chosenPerHasta,
                    vtoPago: chosenVtoPago,
                  }),
                });

                if (emitRes.ok) {
                  const resData = await emitRes.json();
                  if (resData && resData.cae) {
                    caeOfficial = resData.cae;
                    caeVtoOfficial = resData.vtoCae;
                    nroOfficial = resData.nro;
                    pvOfficial = resData.pv || pv;
                  }
                } else {
                  const errJson = await emitRes.json().catch(() => ({}));
                  throw new Error(errJson.error || `Error HTTP ${emitRes.status} desde conector ARCA`);
                }
              } catch (eArca) {
                if (modoArca === "oficial" && !confirm(`No se pudo conectar con el servidor ARCA (${eArca.message}). ¿Deseás emitir en modo offline/autónomo?`)) {
                  $("#btn-confirm-arca", root).disabled = false;
                  $("#btn-confirm-arca", root).textContent = "⚡ Confirmar y Emitir Factura ARCA";
                  return;
                }
              }
            }

            $("#btn-confirm-arca", root).textContent = "Guardando comprobante…";
            const fac = await api("/api/quotes/" + q.id + "/facturar", {
              method: "POST",
              body: {
                fecha: chosenFecha,
                periodoDesde: chosenPerDesde,
                periodoHasta: chosenPerHasta,
                vtoPago: chosenVtoPago,
                ordenCompra: oc,
                ejercicio: ej,
                incluirOcEnConcepto: chk,
                cae: caeOfficial || undefined,
                vtoCae: caeVtoOfficial || undefined,
                nro: nroOfficial || undefined,
                pv: pvOfficial || undefined,
              },
            });
            closeModal();
            toast("¡Factura Electrónica " + fac.numero + " emitida con éxito!");
            go("factura-pdf", { id: fac.id });
          } catch (err) {
            alert("Error al emitir factura: " + (err.message || err));
            $("#btn-confirm-arca", root).disabled = false;
            $("#btn-confirm-arca", root).textContent = "⚡ Confirmar y Emitir Factura ARCA";
          }
        };
      }
    );
  } catch (err) {
    alert("Error al abrir facturación: " + (err.message || err));
  }
}

async function makePdfBlob() {
  const el = $("#pdfdoc");
  if (!el) throw new Error("Documento no encontrado");

  // Forzar captura en formato A4 estándar (794px = 210mm a 96DPI)
  const canvas = await html2canvas(el, {
    scale: 2,
    useCORS: true,
    backgroundColor: "#ffffff",
    windowWidth: 1024,
    onclone: (clonedDoc) => {
      const clonedEl = clonedDoc.getElementById("pdfdoc");
      if (clonedEl) {
        clonedEl.style.width = "794px";
        clonedEl.style.minWidth = "794px";
        clonedEl.style.maxWidth = "794px";
        clonedEl.style.boxSizing = "border-box";
        clonedEl.style.margin = "0 auto";
        clonedEl.style.padding = "24px 28px";
        clonedEl.style.fontSize = "11.5px";
        clonedEl.style.transform = "none";

        const topEl = clonedEl.querySelector(".pdf-top");
        if (topEl) topEl.style.gridTemplateColumns = "1fr 200px";

        const arcaTop = clonedEl.querySelector(".pdf-arca-top");
        if (arcaTop) arcaTop.style.gridTemplateColumns = "1.15fr 74px 1.15fr";

        const clientEl = clonedEl.querySelector(".pdf-client");
        if (clientEl) clientEl.style.gridTemplateColumns = "1fr 1fr";

        const footEl = clonedEl.querySelector(".pdf-foot");
        if (footEl) footEl.style.gridTemplateColumns = "1fr 1fr";

        const signEl = clonedEl.querySelector(".pdf-sign");
        if (signEl) signEl.style.gridTemplateColumns = "1fr 1fr";
      }
    },
  });

  const img = canvas.toDataURL("image/jpeg", 0.96);
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF("p", "mm", "a4");
  const pageW = 210;
  const pageH = 297;
  const imgH = (canvas.height * pageW) / canvas.width;

  // Si entra en una página A4, la ajustamos perfecta a 1 hoja
  if (imgH <= pageH + 8) {
    pdf.addImage(img, "JPEG", 0, 0, pageW, Math.min(imgH, pageH));
  } else {
    let hLeft = imgH;
    let pos = 0;
    pdf.addImage(img, "JPEG", 0, pos, pageW, imgH);
    hLeft -= pageH;
    while (hLeft > 5) {
      pos = hLeft - imgH;
      pdf.addPage();
      pdf.addImage(img, "JPEG", 0, pos, pageW, imgH);
      hLeft -= pageH;
    }
  }
  return pdf.output("blob");
}

async function downloadPdf(numero) {
  try {
    toast("Generando PDF…");
    const blob = await makePdfBlob();
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `Presupuesto_${numero}.pdf`;
    a.click();
    toast("PDF descargado");
  } catch (e) {
    toast("No se pudo armar el PDF. Probá Imprimir → Guardar como PDF.");
  }
}

async function sharePdf(q) {
  try {
    const blob = await makePdfBlob();
    const file = new File([blob], `Presupuesto_${q.numero}.pdf`, { type: "application/pdf" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: "Presupuesto " + q.numero, text: q.clientSnapshot?.nombre });
      return;
    }
    await downloadPdf(q.numero);
    const wa = (q.clientSnapshot?.whatsapp || "").replace(/\D/g, "");
    if (wa) window.open(`https://wa.me/${wa}?text=${encodeURIComponent("Te adjunto el presupuesto " + q.numero + " por " + money(q.totals.total) + ".")}`, "_blank");
  } catch (e) {
    if (e.name !== "AbortError") toast("Usá Descargar PDF y adjuntarlo al chat.");
  }
}

    const vtoPagoFormatted = dAR(fac.vtoPago || fac.vtoCae);
    const planFormatted = fac.pagoTipo && fac.pagoTipo !== "contado" ? `\n• Plan de Pago: ${fac.pagoTipo} días f/factura.` : "";
    const shareText = `Hola ${cli.nombre || "Cliente"}, te adjunto la Factura Electrónica ARCA ${fac.tipoCmpNombre || "Factura " + fac.letra} N° ${fac.numero} por ${money(t.total || 0)}.\n• CAE N°: ${fac.cae || "—"}\n• Fecha Vto. para el pago: ${vtoPagoFormatted}${planFormatted}\n\n¡Muchas gracias!`;

    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({
        files: [file],
        title: `Factura ${fac.numero}`,
        text: shareText,
      });
      return;
    }

    // Fallback para navegadores que no soportan Web Share con archivo (ej: PC)
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = fileName;
    a.click();
    toast("PDF descargado. Abriendo WhatsApp para enviar…");

    const wa = (cli.whatsapp || "").replace(/\D/g, "");
    const msg = encodeURIComponent(shareText);
    setTimeout(() => {
      if (wa) window.open(`https://wa.me/${wa}?text=${msg}`, "_blank");
      else window.open(`https://wa.me/?text=${msg}`, "_blank");
    }, 600);
  } catch (e) {
    if (e.name !== "AbortError") {
      toast("Error al compartir. Podés descargar el PDF y adjuntarlo al chat.");
    }
  }
}

      <div class="row" onclick="logout(true)"><div class="meta"><div class="title">Cerrar sesión</div><div class="sub">El PIN sigue valiendo a distancia</div></div></div>
    </div>
    <div class="card" style="margin-top:16px">
      <b>Esta es la app del celular</b>
      <p class="tiny">Los datos quedan guardados en este teléfono. Para copiarla a otra persona o hacer backup, usá Exportar respaldo.</p>
      <p class="tiny" id="urlbox"></p>
    </div>
    <input type="file" id="impfile" accept="application/json" hidden />
  `;
  if ($("#urlbox")) $("#urlbox").textContent = window.PLAZO_OFFLINE ? "Archivo local · PIN 1234" : location.origin;
  $("#inst").onclick = async () => {
    if (state.deferredPrompt) {
      state.deferredPrompt.prompt();
      return;
    }
    toast("En Chrome Android: menú ⋮ → Instalar app / Agregar a pantalla de inicio");
  };
  $("#exp").onclick = async () => {
    const data = await api("/api/export");
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `plazo-respaldo-${todayISO()}.json`;
    a.click();
    toast("Respaldo descargado correctamente");
  };
  $("#imp").onclick = () => $("#impfile").click();
  $("#impfile").onchange = async (e) => {
    const f = e.target.files[0];
    if (!f) return;
    try {
      const json = JSON.parse(await f.text());
      if (!confirm("Esto reemplaza clientes, presupuestos y cuotas. ¿Seguir?")) return;
      await api("/api/import", { method: "POST", body: json });
      toast("Respaldo restaurado");
    } catch {
      toast("Archivo inválido");
    }
  };
}

function getArcaBaseUrl(s) {
  if (location.protocol === "http:" || location.protocol === "https:") {
    if (!s || !s.arcaServerUrl || s.arcaServerUrl === "http://localhost:3000" || s.arcaServerUrl === "/") {
      return "";
    }
  }
  return String((s && s.arcaServerUrl) || "http://localhost:3000").replace(/\/+$/, "");
}
window.getArcaBaseUrl = getArcaBaseUrl;

          <div class="field"><label>Fecha</label><input type="date" name="fecha" value="${model.fecha}" /></div>
          <div class="field"><label>Presupuesto asociado</label>
            <select name="presupuestoId">
              <option value="">Ninguno</option>
              ${(quotes || []).map((q) => `<option value="${q.id}" ${model.presupuestoId === q.id ? "selected" : ""}>${esc(q.numero)} · ${esc(q.clientSnapshot?.nombre)}</option>`).join("")}
            </select>
          </div>
        </div>
        <div class="field"><label>Origen / depósito</label><input name="origen" value="${esc(model.origen)}" /></div>
        <div class="field"><label>Destino / entrega</label><input name="destino" value="${esc(model.destino)}" /></div>
        <div class="two">
          <div class="field"><label>Transporte</label><input name="transporte" value="${esc(model.transporte)}" /></div>
          <div class="field"><label>Patente</label><input name="patente" value="${esc(model.patente)}" /></div>
        </div>
        <div class="field"><label>Chofer</label><input name="chofer" value="${esc(model.chofer)}" /></div>
        <div class="card">
          <div class="item-head"><b>Mercadería</b>
            <select id="fromcat" style="height:34px;border-radius:10px;border:1px solid var(--line)">
              <option value="">Del catálogo…</option>
              ${catalog.map((c) => `<option value="${c.id}">${esc(c.descripcion)}</option>`).join("")}
            </select>
          </div>
          <div id="items">${model.items.map(remitoItemRow).join("")}</div>
          <button type="button" class="btn btn-soft btn-sm" id="additem">＋ Renglón</button>
        </div>
        <div class="field"><label>Observaciones</label><textarea name="observaciones">${esc(model.observaciones)}</textarea></div>
        <div class="actions">
          <button class="btn btn-primary grow" type="submit">Guardar remito</button>
          <button class="btn btn-soft" type="button" id="saveem">Guardar y emitir</button>
        </div>
      </form>
    `;
    const read = () => {
      const f = $("#rf");
      model.clientId = f.clientId.value;
      model.fecha = f.fecha.value;
      model.presupuestoId = f.presupuestoId.value;
      model.origen = f.origen.value;
      model.destino = f.destino.value;
      model.transporte = f.transporte.value;
      model.patente = f.patente.value;
      model.chofer = f.chofer.value;
      model.observaciones = f.observaciones.value;
      model.items = $$(".item-line", f).map((el) => ({
        descripcion: $("[name=desc]", el).value,
        codigo: $("[name=cod]", el).value,
        cantidad: Number($("[name=cant]", el).value || 0),
        unidad: $("[name=un]", el).value,
      }));
    };
    $("[name=clientId]", v).onchange = () => {
      read();
      const c = clients.find((x) => x.id === model.clientId);
      if (c && !model.destino) model.destino = c.domicilio || "";
      paint();
    };
    $("#additem").onclick = () => {
      read();
      model.items.push({ descripcion: "", cantidad: 1, unidad: "un", codigo: "" });
      paint();
    };
    $$(".btn-del-r", v).forEach((b) => {
      b.onclick = () => {
        read();
        model.items.splice(Number(b.closest(".item-line").dataset.idx), 1);
        if (!model.items.length) model.items.push({ descripcion: "", cantidad: 1, unidad: "un", codigo: "" });
        paint();
      };
    });
    $("#fromcat").onchange = (e) => {
      const it = catalog.find((c) => c.id === e.target.value);
      if (!it) return;
      read();
      model.items.push({ descripcion: it.descripcion, cantidad: 1, unidad: it.unidad, codigo: it.codigo || "" });
      paint();
    };
    $("#addcli").onclick = () =>
      quickClient((c) => {
        clients.push(c);
        model.clientId = c.id;
        model.destino = c.domicilio || model.destino;
        paint();
      });
    const save = async (emitir) => {
      read();
      const q = (quotes || []).find((x) => x.id === model.presupuestoId);
      const body = { ...model, presupuestoNumero: q ? q.numero : "", status: emitir ? "emitido" : existing?.status || "borrador" };
      try {
        const saved = editing
          ? await api("/api/remitos/" + existing.id, { method: "PUT", body })
          : await api("/api/remitos", { method: "POST", body });
        if (emitir && saved.status !== "emitido") {
          await api(`/api/remitos/${saved.id}/status`, { method: "PATCH", body: { status: "emitido" } });
        }
        toast(emitir ? "Remito emitido" : "Remito guardado");
        go("remito-ver", { id: saved.id });
      } catch (err) {
        toast(err.message);
      }
    };
    $("#rf").onsubmit = (e) => {
      e.preventDefault();
      save(false);
    };
    $("#saveem").onclick = () => save(true);
  };
  paint();
}

function openModal(html, bind) {
  const root = $("#modal-root");
  root.innerHTML = `<div class="modal-bg"><div class="modal">${html}</div></div>`;
  $(".modal-bg", root).addEventListener("click", (e) => {
    if (e.target.classList.contains("modal-bg")) closeModal();
  });
  bind && bind(root);
}

  $("#modal-root").innerHTML = "";

      <div class="field"><label>Titular de la cuenta</label><input name="titular" value="${esc(d.cobro.titular)}" /></div>
      <div class="field"><label>Banco</label><input name="banco" value="${esc(d.cobro.banco)}" /></div>
      <div class="two">
        <div class="field"><label>CBU</label><input name="cbu" value="${esc(d.cobro.cbu)}" /></div>
        <div class="field"><label>Alias</label><input name="alias" value="${esc(d.cobro.alias)}" /></div>
      </div>
      <div class="field"><label>Tu WhatsApp (para que te avisen)</label><input name="whatsapp" value="${esc(d.admin.whatsapp)}" /></div>
      <div class="field"><label>PIN nuevo del dueño (opcional)</label><input name="pin" inputmode="numeric" placeholder="dejar vacío para no cambiar" /></div>
      <button class="btn btn-primary" type="submit">Guardar</button>
    </form>`;
  $("#af").onsubmit = async (e) => {
    e.preventDefault();
    const f = e.target;
    const body = {
      30: { precio: Number(f.p30.value) },
      60: { precio: Number(f.p60.value) },
      90: { precio: Number(f.p90.value) },
      cobro: { titular: f.titular.value, banco: f.banco.value, cbu: f.cbu.value, alias: f.alias.value },
      admin: { whatsapp: f.whatsapp.value },
    };
    if (f.pin.value) body.admin.pin = f.pin.value;
    await api("/api/admin/planes", { method: "PUT", body });
    toast("Precios guardados");
  };
}

function viewAdminSalir(v) {
  v.innerHTML = `<h2 class="page-title">Salir</h2><p class="lede">Cerrá sesión del panel de dueño.</p>
    <button class="btn btn-primary" onclick="logout(true)">Cerrar sesión</button>`;
}

async function boot() {
  if ("serviceWorker" in navigator && !window.PLAZO_OFFLINE && location.protocol !== "file:") {
    navigator.serviceWorker.register("/sw.js").catch(() => {});
  }
  if (!state.token) return;
  try {
    const me = await api("/api/me");
    state.role = me.role;
    state.settings = me.settings || null;
    state.licencia = me.licencia || null;
    state.cobro = me.cobro || null;
    state.adminWhatsapp = me.adminWhatsapp || "";
    localStorage.setItem("plazo_role", me.role || "");
    enter();
  } catch {
    logout(false);
  }
}
boot();
